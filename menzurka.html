<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Menzurka – pixelowa woda</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #05060a;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #e8ecf5;
  }
  #sim { position: fixed; inset: 0; display: block; z-index: 0; }
  #hint {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #8b93ad;
    background: rgba(10, 12, 20, 0.72);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 6px 14px;
    z-index: 20;
    user-select: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="sim"></canvas>
<div id="hint">Przeciągnij menzurkę myszką • potrząśnij, aby rozchlapać wodę • dwuklik: reset</div>
<script src="menzurka-water.js"></script>
</body>
</html>
